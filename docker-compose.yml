# Local Matcha Flavoured Wiki. `docker compose up -d`, then `./tools/build.sh`.
services:
  wiki:
    build: ./site
    image: matcha-wiki:1.45
    container_name: matcha-wiki
    ports:
      - "8080:80"
    volumes:
      - ./site:/var/www/site:ro
      - ./site/apache-rewrite.conf:/etc/apache2/conf-enabled/matcha-rewrite.conf:ro
      - ./site/assets:/var/www/html/assets:ro
      - ./site/data:/var/www/data
      - ./site/images:/var/www/html/images
      - ./build:/build:ro
      # page sources, so each page can link to its own file on GitHub
      - ./wiki:/var/www/wiki:ro
    environment:
      # Directory mount (not a single-file mount) so edits to LocalSettings.php are seen immediately
      MW_CONFIG_FILE: /var/www/site/LocalSettings.php
      # "ci" for one-shot builds from an empty database (parser cache on, see LocalSettings.php)
      MFW_BUILD_MODE: ${MFW_BUILD_MODE:-}
    restart: unless-stopped
