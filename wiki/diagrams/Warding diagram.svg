<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308" font-family='"Liberation Sans", Arial, Helvetica, FreeSans, sans-serif' role="img">
<title>Warding's slowing, damage and Wither radii at levels 1 to 4, to scale</title>
<circle cx="95" cy="125" r="27.67" fill="#c3d4f1" stroke="#2c5aad" stroke-width="1.5"/>
