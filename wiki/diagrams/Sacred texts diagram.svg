<path d="M420 28 L443 28" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M550 28 L573 28" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M322 53 L322 88 L204 88" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<text x="261" y="79" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">Archaeologist</text>
<path d="M105 113 L105 122" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<text x="112" y="117.5" font-size="11.5" fill="#4f555b" dominant-baseline="middle">leads to</text>
<path d="M203 148 L223 148" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M203 208 L223 208" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M420 178 L443 178" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M203 268 L223 268" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M420 268 L443 268" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M203 328 L223 328" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M420 328 L443 328" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M203 388 L223 388" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M420 388 L443 388" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M550 268 L573 268" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M662 53 L662 106 L551 106" fill="none" stroke="#b0392f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowred)"/>
<text x="670" y="84" font-size="11.5" fill="#b0392f" dominant-baseline="middle">1 with each book</text>
<text x="670" y="99" font-size="11.5" fill="#b0392f" dominant-baseline="middle">(2 for the Lesser Key)</text>
