<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family='"Liberation Sans", Arial, Helvetica, FreeSans, sans-serif' role="img">
<title>Where the sacred texts are found and what the Mouthpiece and the Archaeologist trade for them</title>
<defs><marker id="arrowrule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8f989f"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b0392f"/></marker></defs>
<rect x="10" y="6" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<text x="105" y="21" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Fishing, buried treasure</text>
<text x="105" y="37" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">and shipwrecks</text>
<rect x="227" y="6" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="233" y="15" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="336" y="21" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Paradise Lost</text>
<text x="336" y="37" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">or the Divine Comedy</text>
<rect x="10" y="66" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="16" y="75" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="119" y="88.5" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Overgrown Abbey Map</text>
<rect x="10" y="126" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<text x="105" y="141" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Abbey tower</text>
<text x="105" y="157" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">always one of the two</text>
<rect x="10" y="186" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<text x="105" y="201" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Trial chambers</text>
<text x="105" y="217" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">and village temples</text>
<rect x="227" y="126" width="190" height="104" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="233" y="165" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="336" y="171" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Quran</text>
<text x="336" y="187" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">or the Tanakh</text>
<rect x="10" y="246" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<text x="105" y="261" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Desert wells</text>
<text x="105" y="277" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">and desert pyramids, village temples</text>
<rect x="227" y="246" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="233" y="255" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="336" y="268.5" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Avesta</text>
<rect x="10" y="306" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<text x="105" y="328.5" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Mineshafts, dungeons</text>
<rect x="227" y="306" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="233" y="315" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="336" y="328.5" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Book of Enoch</text>
<rect x="10" y="366" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<text x="105" y="388.5" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Stronghold libraries</text>
<rect x="227" y="366" width="190" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="233" y="375" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="336" y="388.5" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Lesser Key of Solomon</text>
<rect x="447" y="6" width="100" height="404" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<text x="497" y="200" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Mouthpiece</text>
<text x="497" y="217" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">trades</text>
<rect x="577" y="6" width="170" height="44" fill="#f1c7c2" stroke="#b0392f" stroke-width="1.2" rx="6"/>
<image x="583" y="15" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="676" y="28.5" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Crystal Heart</text>
<rect x="577" y="246" width="170" height="44" fill="#dccfef" stroke="#66489e" stroke-width="1.2" rx="6"/>
<image x="583" y="255" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="676" y="261" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Ofuda</text>
<text x="676" y="277" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">one for each book</text>
