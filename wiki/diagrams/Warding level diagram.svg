<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" font-family='"Liberation Sans", Arial, Helvetica, FreeSans, sans-serif' role="img">
<title>How the warding level is worked out: held warding summed and capped, then the higher of that and the electrum armor count</title>
<defs><marker id="arrowrule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8f989f"/></marker></defs>
<rect x="15" y="8" width="170" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="21" y="17" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="114" y="23" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Main hand</text>
<text x="114" y="39" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">its Warding level</text>
<rect x="15" y="68" width="170" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="21" y="77" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="114" y="83" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Off hand</text>
<text x="114" y="99" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">its Warding level</text>
<rect x="15" y="148" width="170" height="44" fill="#f7f9fb" stroke="#aab3bb" stroke-width="1.2" rx="6"/>
<image x="21" y="157" width="26" height="26" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="114" y="163" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Electrum armor</text>
<text x="114" y="179" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">+1 per piece worn</text>
<rect x="245" y="38" width="190" height="44" fill="#dccfef" stroke="#66489e" stroke-width="1.2" rx="6"/>
<text x="340" y="53" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Held warding</text>
<text x="340" y="69" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">the sum, capped at 3</text>
<rect x="245" y="148" width="190" height="44" fill="#dccfef" stroke="#66489e" stroke-width="1.2" rx="6"/>
<text x="340" y="163" font-size="13" fill="#202122" text-anchor="middle" dominant-baseline="middle">Armor count</text>
<text x="340" y="179" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">0 to 4</text>
<rect x="505" y="93" width="190" height="44" fill="#dccfef" stroke="#66489e" stroke-width="1.2" rx="6"/>
<text x="600" y="108" font-size="13" fill="#66489e" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Warding level</text>
<text x="600" y="124" font-size="11.5" fill="#4f555b" text-anchor="middle" dominant-baseline="middle">the higher of the two</text>
<path d="M188 41 L241 47.62" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M188 79 L241 72.38" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M188 170 L241 170" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M438 80.73 L501 94.06" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<path d="M438 149.27 L501 135.94" fill="none" stroke="#8f989f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowrule)"/>
<text x="15" y="222" font-size="11.5" fill="#4f555b" font-weight="bold" dominant-baseline="middle">Examples</text>
<text x="15" y="240" font-size="11.5" fill="#4f555b" dominant-baseline="middle">Warding Sword (1) + Nazar (2) in the hands: 3</text>
<text x="15" y="258" font-size="11.5" fill="#4f555b" dominant-baseline="middle">One electrum piece and a Warding 1 item: 1</text>
<text x="15" y="276" font-size="11.5" fill="#4f555b" dominant-baseline="middle">Full electrum set: 4, the only way to reach it</text>
</svg>
